[package]
name = "cr-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "cleangroove-rt"
path = "src/main.rs"

[dependencies]
cr-dsp = { workspace = true }
cr-audio-io = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
cpal = "0.15"
rtrb = "0.3"
crossbeam-channel = "0.5"
ctrlc = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


[target.'cfg(unix)'.dependencies]
# Quiets ALSA plugin chatter on stderr while devices are probed (backend/devices.rs).
libc = "0.2"
