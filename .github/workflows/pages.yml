name: Web demo

# Builds the browser demo (web/) and publishes it with GitHub Pages.
# Needs Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["web/**", "crates/cr-dsp/**", "crates/cr-wasm/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: sh web/build.sh
      - name: Collect the site
        run: |
          mkdir site
          cp web/index.html web/app.js web/worker.js web/player.js web/cr_wasm.wasm web/icon_256.png site/
          # Tag this release's files so browsers do not mix cached and new ones.
          sed -i "s/app.js?v=dev/app.js?v=${GITHUB_SHA::7}/" site/index.html
          grep -q "app.js?v=${GITHUB_SHA::7}" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
