name: Release

# Push a tag such as v0.1.0 to build Windows and Linux binaries and attach them to a draft
# GitHub Release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            exe: .exe
          - os: ubuntu-latest
            name: linux-x86_64
            exe: ""
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked -p cr-gui -p cr-cli -p cr-rt

      - name: Package
        shell: bash
        run: |
          dir="cleangroove-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          for b in cleangroove cleangroove-cli cleangroove-rt; do cp "target/release/$b${{ matrix.exe }}" "$dir/"; done
          cp README.md CHANGELOG.md CREDITS.md LICENSE-MIT LICENSE-APACHE "$dir/"
          cp docs/MANUAL.md docs/USER_GUIDE.md "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ env.ASSET }}
